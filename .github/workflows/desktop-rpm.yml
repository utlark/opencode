name: desktop-rpm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to embed in the build"
        required: false
        default: "2.0.28"
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2

      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Fetch release notes
        id: notes
        run: |
          gh api "repos/anomalyco/opencode/releases/tags/v${{ inputs.version }}" \
            --jq '.body // empty' > release-notes.md || echo "" > release-notes.md
          {
            echo "notes<<NOTES_EOF"
            cat release-notes.md
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build CLI
        run: ./packages/cli/script/build.ts --target=opencode-linux-x64-baseline
        env:
          BUN_COMPILE_RELEASE: bun-v1.4.2
          # No OPENCODE_CHANNEL on purpose: the official release job builds the CLI
          # with channel "latest" (baked into the binary and user agent), and the
          # desktop prod packaging copies it from here.
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_RELEASE_NOTES: ${{ steps.notes.outputs.notes }}

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist

      - name: Package
        run: npx electron-builder --linux rpm --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_CLI_TARGET: x86_64-unknown-linux-gnu

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-desktop-rpm
          path: packages/desktop/dist/*.rpm
